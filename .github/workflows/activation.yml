name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Generate .alf File 🔑
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate .alf File via Unity Docker
        run: |
          docker run --rm -v "$PWD":/project -w /project unityci/editor:ubuntu-2022.3.62f3-base-3 unity-editor -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true
          ls -lh *.alf

      - name: Upload .alf Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2022_Activation_File
          path: "*.alf"

